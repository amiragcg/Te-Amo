<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tienes una carta 💌</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #fce7f3 0%, #fbcfe8 50%, #f3e8ff 100%);
      overflow: hidden;
      padding: 20px;
    }

    .scene {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 36px;
    }

    /* CONTENEDOR DEL SOBRE */
    .envelope-wrapper {
      position: relative;
      width: 320px;
      height: 210px;
      background: #f472b6;
      border-radius: 12px;
      box-shadow: 0 20px 40px rgba(219, 39, 119, 0.22);
      transition: transform 0.4s ease;
    }

    .envelope-wrapper:not(.open):hover {
      transform: translateY(-4px);
    }

    /* CARTA INTERIOR */
    .letter {
      position: absolute;
      left: 16px;
      right: 16px;
      bottom: 14px;
      height: 185px;
      background: #ffffff;
      border-radius: 10px;
      padding: 24px 18px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.08);
      transition: transform 0.75s cubic-bezier(0.34, 1.56, 0.64, 1), z-index 0.1s;
      z-index: 2;
    }

    .envelope-wrapper.open .letter {
      transform: translateY(-115px);
      z-index: 5;
    }

    .letter-tag {
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: #db2777;
      margin-bottom: 8px;
    }

    .letter h1 {
      font-size: 1.55rem;
      font-weight: 800;
      color: #1f2937;
      line-height: 1.25;
    }

    .letter p {
      margin-top: 8px;
      font-size: 0.9rem;
      color: #6b7280;
    }

    /* SOLAPAS DEL SOBRE */
    .pocket {
      position: absolute;
      inset: 0;
      border-radius: 12px;
      overflow: hidden;
      z-index: 3;
      pointer-events: none;
    }

    .pocket::before {
      content: "";
      position: absolute;
      inset: 0;
      background: #ec4899;
      clip-path: polygon(0 0, 50% 55%, 0 100%);
    }

    .pocket::after {
      content: "";
      position: absolute;
      inset: 0;
      background: #f472b6;
      clip-path: polygon(100% 0, 50% 55%, 100% 100%);
    }

    .bottom-flap {
      position: absolute;
      inset: 0;
      background: #db2777;
      border-radius: 12px;
      clip-path: polygon(0 100%, 50% 48%, 100% 100%);
      z-index: 4;
      pointer-events: none;
    }

    /* SOLAPA SUPERIOR QUE SE ABRE */
    .top-flap {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 125px;
      background: #be185d;
      clip-path: polygon(0 0, 100% 0, 50% 100%);
      transform-origin: top center;
      transition: transform 0.6s ease, z-index 0.2s;
      z-index: 6;
      border-top-left-radius: 12px;
      border-top-right-radius: 12px;
    }

    .envelope-wrapper.open .top-flap {
      transform: rotateX(180deg);
      z-index: 1;
    }

    /* SELLO DE CORAZÓN */
    .seal {
      position: absolute;
      top: 96px;
      left: 50%;
      transform: translateX(-50%);
      width: 44px;
      height: 44px;
      background: #fff1f2;
      border: 3px solid #fda4af;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.25rem;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.15);
      z-index: 7;
      transition: opacity 0.3s ease, transform 0.3s ease;
      cursor: pointer;
    }

    .envelope-wrapper.open .seal {
      opacity: 0;
      transform: translateX(-50%) scale(0.5);
      pointer-events: none;
    }

    /* BOTÓN DE ACCIÓN */
    .btn-open {
      background: #db2777;
      color: #ffffff;
      border: none;
      padding: 13px 34px;
      border-radius: 999px;
      font-size: 1rem;
      font-weight: 700;
      letter-spacing: 0.4px;
      cursor: pointer;
      box-shadow: 0 10px 25px rgba(219, 39, 119, 0.35);
      transition: transform 0.2s ease, background 0.2s ease;
    }

    .btn-open:hover {
      background: #be185d;
      transform: scale(1.04);
    }

    .btn-open:active {
      transform: scale(0.98);
    }

    /* CORAZONES Y BURBUJAS FLOTANTES */
    .floating-item {
      position: fixed;
      font-size: 1.5rem;
      pointer-events: none;
      animation: floatUp 2.6s ease-out forwards;
      z-index: 20;
    }

    @keyframes floatUp {
      0% {
        opacity: 1;
        transform: translateY(0) scale(0.7);
      }
      100% {
        opacity: 0;
        transform: translateY(-260px) scale(1.35) rotate(15deg);
      }
    }
  </style>
</head>
<body>

  <div class="scene">
    <div class="envelope-wrapper" id="envelope">
      <div class="top-flap"></div>

      <div class="letter">
        <span class="letter-tag">Para ti 💌</span>
        <h1>Te amo mucho, báñate.</h1>
        <p>Con mucho cariño (y por el bien de todos) 🧼✨</p>
      </div>

      <div class="pocket"></div>
      <div class="bottom-flap"></div>
      <div class="seal" onclick="toggleEnvelope()" title="Abrir">❤️</div>
    </div>

    <button class="btn-open" id="action-btn" onclick="toggleEnvelope()">Abrir</button>
  </div>

  <script>
    let isOpen = false;

    function toggleEnvelope() {
      const envelope = document.getElementById('envelope');
      const btn = document.getElementById('action-btn');
      isOpen = !isOpen;

      if (isOpen) {
        envelope.classList.add('open');
        btn.innerText = 'Cerrar';
        launchEmojis();
      } else {
        envelope.classList.remove('open');
        btn.innerText = 'Abrir';
      }
    }

    function launchEmojis() {
      const emojis = ['❤️', '🧼', '🫧', '💖', '🚿', '✨'];
      for (let i = 0; i < 16; i++) {
        setTimeout(() => {
          const el = document.createElement('div');
          el.className = 'floating-item';
          el.innerText = emojis[Math.floor(Math.random() * emojis.length)];
          el.style.left = (25 + Math.random() * 50) + 'vw';
          el.style.top = (45 + Math.random() * 20) + 'vh';
          document.body.appendChild(el);
          setTimeout(() => el.remove(), 2600);
        }, i * 90);
      }
    }
  </script>
</body>
</html>
